<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Video Switcher</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Video Switcher</h1>
    <nav class="tabs" id="tabs">
      <button class="tab-btn active" data-tab="switcher" type="button">Switcher</button>
      <button class="tab-btn" data-tab="settings" type="button">Settings</button>
    </nav>
    <span id="connection-status" class="badge badge-disconnected">disconnected</span>
  </header>

  <main id="view-switcher" class="view">
    <section class="monitors-pane">
      <div class="monitor">
        <div class="monitor-label label-pgm">PROGRAM</div>
        <img id="program-preview" alt="program preview" />
      </div>
      <div class="monitor">
        <div class="monitor-label label-pvw">PREVIEW</div>
        <img id="preview-preview" alt="preview monitor" />
      </div>
    </section>

    <section class="controls-pane">
      <div class="panel">
        <h2>Sources <span class="hint">(loads into preview)</span></h2>
        <div id="cut-sources" class="button-grid"></div>
      </div>

      <div class="panel">
        <h2>Transition</h2>
        <div class="transition-row">
          <button id="cut-btn" class="transition-button cut">CUT</button>
          <button id="auto-btn" class="transition-button auto">AUTO (Fade)</button>
          <label class="duration-label">
            Fade
            <input id="fade-duration" type="range" min="150" max="2000" step="50" value="500" />
            <span id="fade-duration-value">500ms</span>
          </label>
        </div>
      </div>

      <div class="panel">
        <h2>Overlay</h2>
        <div id="overlay-sources" class="button-grid"></div>
      </div>

      <div class="panel">
        <h2>Stream</h2>
        <div class="stream-form">
          <select id="stream-kind">
            <option value="rtmp">RTMP</option>
            <option value="srt">SRT</option>
          </select>
          <input id="stream-url" type="text" placeholder="rtmp://server/app/key" />
          <button id="stream-toggle">Start Stream</button>
        </div>
        <span id="stream-status" class="badge badge-off">off air</span>
      </div>

      <div id="error-log" class="error-log"></div>
    </section>
  </main>

  <main id="view-settings" class="view" hidden>
    <section class="settings-pane">
      <div id="cfg-banner" class="settings-banner" hidden></div>

      <div class="panel">
        <h2>Program</h2>
        <div class="settings-row">
          <label class="field">Width <input id="cfg-width" type="number" min="160" step="2" /></label>
          <label class="field">Height <input id="cfg-height" type="number" min="90" step="2" /></label>
          <label class="field">FPS <input id="cfg-fps" type="number" min="1" max="120" /></label>
        </div>
      </div>

      <div class="panel">
        <h2>Sources <span class="hint">cameras, capture cards, test patterns - switchable on air</span></h2>
        <div id="cfg-cut-rows"></div>
        <div class="settings-actions">
          <button id="cfg-add-cut" type="button">+ Add source</button>
        </div>
      </div>

      <div class="panel">
        <h2>Overlay <span class="hint">one NDI lower-thirds layer, always on top</span></h2>
        <div id="cfg-overlay-row"></div>
      </div>

      <div class="panel">
        <h2>Audio</h2>
        <div id="cfg-audio-row"></div>
      </div>

      <div class="panel">
        <div class="settings-actions">
          <button id="cfg-detect" type="button">Detect cameras / mics</button>
          <span id="cfg-detect-status" class="hint"></span>
        </div>
      </div>

      <div class="panel settings-save-panel">
        <div id="cfg-message" class="settings-message"></div>
        <div class="settings-actions">
          <button id="cfg-save" type="button" class="cta">Save config.json</button>
          <button id="cfg-restart" type="button">Restart Engine to apply</button>
        </div>
      </div>
    </section>
  </main>

  <script src="renderer.js"></script>
  <script src="settings.js"></script>
</body>
</html>
